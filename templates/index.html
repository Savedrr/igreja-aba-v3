<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Igreja ABA</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0A2463">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;background:linear-gradient(145deg,#061A3A,#0A2463 60%,#0d3585);
  display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;}
.card{background:rgba(255,255,255,.07);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.13);border-radius:24px;padding:44px 38px;
  width:400px;max-width:92vw;box-shadow:0 24px 64px rgba(0,0,0,.4);}
.title{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:8px;color:#fff;
  text-align:center;line-height:1;margin-bottom:6px;}
.sub{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#56B4D3;
  text-align:center;margin-bottom:32px;}
.div{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);margin-bottom:26px;}
.fg{margin-bottom:16px;}
.fg label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:1px;color:rgba(255,255,255,.45);margin-bottom:6px;}
.iw{position:relative;}
.iw svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;color:rgba(255,255,255,.3);pointer-events:none;}
input.fi{width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);
  border-radius:11px;padding:13px 13px 13px 42px;color:#fff;font-size:15px;
  font-family:'Inter',sans-serif;outline:none;transition:all .2s;}
input.fi::placeholder{color:rgba(255,255,255,.2);}
input.fi:focus{border-color:#56B4D3;background:rgba(86,180,211,.09);box-shadow:0 0 0 3px rgba(86,180,211,.15);}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:44px;}
.pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:rgba(255,255,255,.35);padding:0;}
.pw-eye svg{width:17px;height:17px;}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#3E7CB1,#56B4D3);
  border:none;border-radius:11px;color:#fff;font-size:14px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;margin-top:6px;transition:all .3s;}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(86,180,211,.3);}
.btn:disabled{opacity:.7;pointer-events:none;}
.err{background:rgba(220,53,69,.15);border:1px solid rgba(220,53,69,.3);color:#ff8888;
  padding:10px 14px;border-radius:9px;font-size:13px;margin-top:12px;display:none;}
.foot{text-align:center;margin-top:20px;font-size:11px;color:rgba(255,255,255,.28);}
.sp{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="title">IGREJA ABA</div>
  <div class="sub">Um Lar Para Pertencer</div>
  <div class="div"></div>
  <div class="fg">
    <label>E-mail</label>
    <div class="iw">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      <input type="email" class="fi" id="email" placeholder="seu@email.com" autocomplete="email">
    </div>
  </div>
  <div class="fg">
    <label>Senha</label>
    <div class="iw pw-wrap">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      <input type="password" class="fi" id="senha" placeholder="••••••••" autocomplete="current-password">
      <button class="pw-eye" onclick="togglePw()" type="button">
        <svg id="eyeIcon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
      </button>
    </div>
  </div>
  <button class="btn" id="btnLogin">Entrar</button>
  <div class="err" id="errMsg"></div>
  <p class="foot">admin@igrejaaba.com &nbsp;·&nbsp; Admin@123</p>
</div>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
}
function togglePw(){
  const i=document.getElementById("senha");
  i.type=i.type==="password"?"text":"password";
}
document.getElementById("senha").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
document.getElementById("btnLogin").addEventListener("click",login);
async function login(){
  const btn=document.getElementById("btnLogin"),err=document.getElementById("errMsg");
  const email=document.getElementById("email").value.trim();
  const senha=document.getElementById("senha").value;
  if(!email||!senha){show("Preencha e-mail e senha.");return;}
  btn.innerHTML='<span class="sp"></span>Entrando...';btn.disabled=true;err.style.display="none";
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,senha})});
    const d=await r.json();
    if(r.ok&&d.ok){btn.innerHTML="✓ "+d.nome;setTimeout(()=>location.href="/app",600);}
    else{show(d.erro||"Erro ao entrar.");btn.innerHTML="Entrar";btn.disabled=false;}
  }catch{show("Erro de conexão.");btn.innerHTML="Entrar";btn.disabled=false;}
}
function show(m){const e=document.getElementById("errMsg");e.textContent=m;e.style.display="block";}
</script>
</body>
</html>
