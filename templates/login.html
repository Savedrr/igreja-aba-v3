<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Igreja ABA</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0A2463">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IGREJA ABA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: linear-gradient(145deg, #061A3A 0%, #0A2463 55%, #0d3585 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    padding: 20px;
  }

  .card {
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 22px;
    padding: 42px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 44px;
    letter-spacing: 8px;
    color: #fff;
    text-align: center;
    line-height: 1;
    margin-bottom: 6px;
  }

  .sub {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #56B4D3;
    text-align: center;
    margin-bottom: 34px;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
    margin-bottom: 28px;
  }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255,255,255,.5);
    margin-bottom: 7px;
  }

  .input-wrap { position: relative; }

  .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: rgba(255,255,255,.3);
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .input-icon svg { width: 18px; height: 18px; }

  input {
    width: 100%;
    background: rgba(255,255,255,.08);
    border: 1.5px solid rgba(255,255,255,.14);
    border-radius: 12px;
    padding: 14px 14px 14px 46px;
    color: #fff;
    font-size: 16px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color .2s, background .2s, box-shadow .2s;
    -webkit-appearance: none;
    appearance: none;
  }

  input::placeholder { color: rgba(255,255,255,.22); }
  input:focus {
    border-color: #56B4D3;
    background: rgba(86,180,211,.1);
    box-shadow: 0 0 0 3px rgba(86,180,211,.18);
  }

  /* Campo senha: espaço para o ícone do olho */
  #senhaWrap input { padding-right: 50px; }

  /* Botão olho — TOTALMENTE clicável */
  .eye-btn {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    color: rgba(255,255,255,.35);
    transition: color .2s;
    /* Garante que seja clicável no mobile */
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    z-index: 2;
  }

  .eye-btn:hover { color: rgba(255,255,255,.7); }
  .eye-btn:active { color: #56B4D3; }
  .eye-btn svg { width: 20px; height: 20px; pointer-events: none; }

  .btn-login {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #3E7CB1, #56B4D3);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 8px;
    transition: transform .2s, box-shadow .2s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(86,180,211,.35);
  }

  .btn-login:active { transform: translateY(0); }
  .btn-login:disabled { opacity: .65; cursor: not-allowed; transform: none; }

  .err-box {
    background: rgba(220,53,69,.18);
    border: 1px solid rgba(220,53,69,.35);
    color: #ff9090;
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.4;
    margin-top: 14px;
    display: none;
  }

  .footer-hint {
    text-align: center;
    margin-top: 22px;
    font-size: 11px;
    color: rgba(255,255,255,.25);
  }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    display: inline-block;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 7px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div class="title">IGREJA ABA</div>
  <div class="sub">Um Lar Para Pertencer</div>
  <div class="divider"></div>

  <!-- E-mail -->
  <div class="field">
    <label for="email">E-mail</label>
    <div class="input-wrap">
      <span class="input-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </span>
      <input type="email" id="email" name="email"
             placeholder="seu@email.com"
             autocomplete="email"
             autocapitalize="none"
             inputmode="email">
    </div>
  </div>

  <!-- Senha -->
  <div class="field">
    <label for="senha">Senha</label>
    <div class="input-wrap" id="senhaWrap">
      <span class="input-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </span>
      <input type="password" id="senha" name="senha"
             placeholder="••••••••"
             autocomplete="current-password">
      <!-- Botão olho: mostra/oculta senha -->
      <button type="button" class="eye-btn" id="eyeBtn"
              aria-label="Mostrar ou ocultar senha"
              onclick="toggleSenha()">
        <!-- Ícone olho aberto (padrão) -->
        <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        </svg>
        <!-- Ícone olho fechado (quando visível) -->
        <svg id="eyeClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
        </svg>
      </button>
    </div>
  </div>

  <button type="button" class="btn-login" id="btnLogin">
    Entrar
  </button>

  <div class="err-box" id="errBox"></div>

  <!-- Auto-cadastro de voluntário -->
  <div style="margin-top:18px;text-align:center">
    <button type="button" onclick="abrirCadastroVol()" style="background:none;border:none;
      color:#56B4D3;font-size:13px;cursor:pointer;padding:6px 10px;font-weight:600;
      text-decoration:underline;text-underline-offset:3px;">
      Sou voluntário — Me cadastrar
    </button>
  </div>
</div>

<!-- MODAL DE AUTO-CADASTRO DE VOLUNTÁRIO -->
<div id="modalCadastroVol" style="display:none;position:fixed;inset:0;z-index:1000;
  background:rgba(10,20,40,.75);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;padding:16px;overflow-y:auto">
  <div style="background:#0F1F3D;border:1px solid rgba(86,180,211,.3);border-radius:18px;
    max-width:420px;width:100%;padding:24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5);margin:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <h2 style="color:#fff;font-size:19px;font-weight:800;margin:0">Cadastro de Voluntário</h2>
      <button onclick="fecharCadastroVol()" style="background:none;border:none;color:rgba(255,255,255,.5);
        font-size:22px;cursor:pointer;line-height:1">✕</button>
    </div>
    <p style="color:rgba(255,255,255,.55);font-size:12px;margin:0 0 16px">
      Crie seu acesso para visualizar sua escala pessoal.
    </p>

    <div style="display:grid;gap:12px">
      <div>
        <label style="color:rgba(255,255,255,.7);font-size:12px;font-weight:600;display:block;margin-bottom:4px">Nome Completo *</label>
        <input type="text" id="cv_nome" placeholder="Seu nome completo"
          style="width:100%;padding:11px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
          background:rgba(255,255,255,.06);color:#fff;font-size:14px;box-sizing:border-box">
      </div>
      <div>
        <label style="color:rgba(255,255,255,.7);font-size:12px;font-weight:600;display:block;margin-bottom:4px">Celular (WhatsApp) *</label>
        <input type="tel" id="cv_celular" placeholder="(51) 99999-9999"
          style="width:100%;padding:11px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
          background:rgba(255,255,255,.06);color:#fff;font-size:14px;box-sizing:border-box">
      </div>
      <div>
        <label style="color:rgba(255,255,255,.7);font-size:12px;font-weight:600;display:block;margin-bottom:4px">E-mail *</label>
        <input type="email" id="cv_email" placeholder="seu@email.com"
          style="width:100%;padding:11px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
          background:rgba(255,255,255,.06);color:#fff;font-size:14px;box-sizing:border-box">
      </div>
      <div>
        <label style="color:rgba(255,255,255,.7);font-size:12px;font-weight:600;display:block;margin-bottom:4px">Senha *</label>
        <input type="password" id="cv_senha" placeholder="Mín. 8 caracteres, 1 maiúscula e 1 número"
          style="width:100%;padding:11px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
          background:rgba(255,255,255,.06);color:#fff;font-size:14px;box-sizing:border-box">
      </div>
      <div>
        <label style="color:rgba(255,255,255,.7);font-size:12px;font-weight:600;display:block;margin-bottom:6px">Departamentos * <span style="font-weight:400;opacity:.6">(escolha um ou mais)</span></label>
        <div id="cv_deptos" style="display:flex;flex-wrap:wrap;gap:7px;max-height:160px;overflow-y:auto;
          padding:4px;background:rgba(255,255,255,.04);border-radius:10px">
          <span style="color:rgba(255,255,255,.4);font-size:12px;padding:6px">Carregando departamentos...</span>
        </div>
      </div>
    </div>

    <div id="cv_err" style="display:none;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);
      color:#FCA5A5;border-radius:9px;padding:9px 12px;font-size:12px;margin-top:12px"></div>

    <button onclick="enviarCadastroVol()" id="cv_btn"
      style="width:100%;margin-top:16px;padding:13px;border:none;border-radius:11px;
      background:linear-gradient(135deg,#1B4FA8,#56B4D3);color:#fff;font-size:15px;font-weight:700;cursor:pointer">
      Criar meu cadastro
    </button>
  </div>

<script>
  // Registra Service Worker para PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js').catch(() => {});
  }

  // Mostra/oculta senha
  function toggleSenha() {
    var input = document.getElementById('senha');
    var open  = document.getElementById('eyeOpen');
    var closed = document.getElementById('eyeClosed');
    if (input.type === 'password') {
      input.type = 'text';
      open.style.display  = 'none';
      closed.style.display = '';
    } else {
      input.type = 'password';
      open.style.display  = '';
      closed.style.display = 'none';
    }
    input.focus();
  }

  // Enter no campo senha faz login
  document.getElementById('senha').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') fazerLogin();
  });
  document.getElementById('email').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('senha').focus();
  });
  document.getElementById('btnLogin').addEventListener('click', fazerLogin);

  async function fazerLogin() {
    var btn   = document.getElementById('btnLogin');
    var err   = document.getElementById('errBox');
    var email = document.getElementById('email').value.trim();
    var senha = document.getElementById('senha').value;

    err.style.display = 'none';

    if (!email || !senha) {
      mostrarErro('Preencha e-mail e senha.');
      return;
    }

    btn.innerHTML = '<span class="spinner"></span> Entrando...';
    btn.disabled  = true;

    try {
      var r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, senha: senha })
      });
      var d = await r.json();

      if (r.ok && d.ok) {
        btn.innerHTML = '✓ Bem-vindo(a), ' + d.nome + '!';
        var destino = d.redirect || '/app';
        setTimeout(function() { window.location.href = destino; }, 500);
      } else {
        mostrarErro(d.erro || 'E-mail ou senha incorretos.');
        btn.innerHTML = 'Entrar';
        btn.disabled  = false;
      }
    } catch (e) {
      mostrarErro('Erro de conexão com o servidor.');
      btn.innerHTML = 'Entrar';
      btn.disabled  = false;
    }
  }

  // ── AUTO-CADASTRO DE VOLUNTÁRIO ──────────────────────────
  let _deptosCarregados = false;
  async function abrirCadastroVol() {
    document.getElementById('modalCadastroVol').style.display = 'flex';
    if (!_deptosCarregados) {
      try {
        const r = await fetch('/api/departamentos/publica');
        const list = await r.json();
        const cont = document.getElementById('cv_deptos');
        if (!list.length) {
          cont.innerHTML = '<span style="color:rgba(255,255,255,.4);font-size:12px;padding:6px">Nenhum departamento disponível.</span>';
          return;
        }
        cont.innerHTML = list.map(d => `
          <label class="cv-depto-label" style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);
            border:2px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;cursor:pointer;
            font-size:12px;color:#fff;transition:all .15s ease">
            <span class="cv-check-box" style="width:20px;height:20px;border-radius:6px;border:2px solid rgba(255,255,255,.3);
              display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;
              background:transparent;transition:all .15s ease"></span>
            <input type="checkbox" value="${d.id}" data-nome="${d.nome}" class="cv-depto-chk"
              style="display:none" onchange="toggleDeptoVisual(this)">
            <span>${d.icone || '👥'} ${d.nome}</span>
          </label>`).join('');
        _deptosCarregados = true;
      } catch(e) {
        document.getElementById('cv_deptos').innerHTML =
          '<span style="color:#FCA5A5;font-size:12px;padding:6px">Erro ao carregar departamentos.</span>';
      }
    }
  }
  function fecharCadastroVol() {
    document.getElementById('modalCadastroVol').style.display = 'none';
  }
  // Atualiza visual do checkbox de departamento (✅ + destaque)
  function toggleDeptoVisual(chk) {
    const label = chk.closest('.cv-depto-label');
    const box   = label.querySelector('.cv-check-box');
    if (chk.checked) {
      box.textContent = '✓';
      box.style.background = '#22C55E';
      box.style.borderColor = '#22C55E';
      box.style.color = '#fff';
      label.style.background = 'rgba(34,197,94,.15)';
      label.style.borderColor = '#22C55E';
    } else {
      box.textContent = '';
      box.style.background = 'transparent';
      box.style.borderColor = 'rgba(255,255,255,.3)';
      label.style.background = 'rgba(255,255,255,.07)';
      label.style.borderColor = 'rgba(255,255,255,.12)';
    }
  }
  function mostrarErroVol(msg) {
    const e = document.getElementById('cv_err');
    e.textContent = msg; e.style.display = 'block';
  }
  async function enviarCadastroVol() {
    const nome    = document.getElementById('cv_nome').value.trim();
    const celular = document.getElementById('cv_celular').value.trim();
    const email   = document.getElementById('cv_email').value.trim().toLowerCase();
    const senha   = document.getElementById('cv_senha').value;
    const deptos  = [...document.querySelectorAll('.cv-depto-chk:checked')].map(c => ({
      id: parseInt(c.value), nome: c.dataset.nome
    }));
    const err = document.getElementById('cv_err');
    err.style.display = 'none';

    if (!nome || !celular || !email || !senha) return mostrarErroVol('Preencha todos os campos.');
    if (senha.length < 8) return mostrarErroVol('A senha deve ter no mínimo 8 caracteres.');
    if (!/[A-Z]/.test(senha)) return mostrarErroVol('A senha deve ter ao menos uma letra maiúscula.');
    if (!/[0-9]/.test(senha)) return mostrarErroVol('A senha deve ter ao menos um número.');
    if (!deptos.length) return mostrarErroVol('Selecione pelo menos um departamento.');

    const btn = document.getElementById('cv_btn');
    btn.textContent = 'Cadastrando...'; btn.disabled = true;

    try {
      const r = await fetch('/api/voluntarios/auto_cadastro', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ nome, celular, email, senha, departamentos: deptos })
      });
      const d = await r.json();
      if (r.ok && d.ok) {
        alert('✅ Cadastro realizado! Agora faça login com seu e-mail e senha.');
        fecharCadastroVol();
        document.getElementById('email').value = email;
        document.getElementById('senha').focus();
      } else {
        mostrarErroVol(d.erro || 'Erro ao cadastrar.');
      }
    } catch(e) {
      mostrarErroVol('Erro de conexão. Tente novamente.');
    }
    btn.textContent = 'Criar meu cadastro'; btn.disabled = false;
  }

  function mostrarErro(msg) {
    var err = document.getElementById('errBox');
    err.textContent   = msg;
    err.style.display = 'block';
  }
</script>
</body>
</html>
