services:
  - type: web
    name: igreja-aba
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers=1 --threads=4 --timeout=120 --bind=0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        value: https://igreja-aba.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: igreja-aba-db
          property: connectionString

databases:
  - name: igreja-aba-db
    plan: free
    region: ohio
